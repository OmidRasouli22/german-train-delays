version: 2

models:
  - name: fct_stop_delays
    description: >
      One row per train, per station, per arrival or departure.
      This is the table the questions get asked of.
    tests:
      # The grain. Two rows for the same stop and event would quietly
      # double every count and shift every average.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - stop_id
              - event

    columns:
      - name: stop_id
        description: The trip this stop belongs to.
        tests:
          - not_null

      - name: event
        description: Whether the train was arriving or leaving.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['arrival', 'departure']

      - name: planned
        description: When the train was due. Without it there is no delay.
        tests:
          - not_null

      - name: station
        description: Station name, used for grouping.
        tests:
          - not_null

  - name: agg_station_daily
    description: >
      One row per station per day. This is what a dashboard reads.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - service_date
              - station

    columns:
      - name: service_date
        tests:
          - not_null
      - name: station
        tests:
          - not_null
      - name: punctuality
        description: Share of trains that ran and were under six minutes late.
